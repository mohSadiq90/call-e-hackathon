[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calle-supplier-status-agent"
version = "1.0.0"
description = "Autonomous CALL-E phone agent for supply chain purchase order status verification, delay detection, and procurement risk aggregation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "calle-ai>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
supplier-agent = "main:main"
supplier-dashboard = "src.server:start_server"
